databases:
  - name: aieien-db
    databaseName: strapi
    user: strapi
    region: oregon
    plan: free

services:
  # 1. Strapi API Backend Web Service
  - type: web
    name: aieien-backend
    runtime: docker
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: ./apps/backend
    region: oregon
    plan: free
    healthCheckPath: /_health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 1337
      - key: DATABASE_CLIENT
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: aieien-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: PUBLIC_URL
        value: https://aieien-backend.onrender.com
      - key: APP_KEYS
        generateValue: true
      - key: API_TOKEN_SALT
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: TRANSFER_TOKEN_SALT
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true

  # 2. Astro Frontend Static Site
  - type: web
    name: aieien-frontend
    runtime: static
    rootDir: apps/web
    buildCommand: pnpm install && pnpm build
    staticPublishPath: dist
    envVars:
      - key: PUBLIC_STRAPI_URL
        value: https://aieien-backend.onrender.com
      - key: STRAPI_URL
        value: https://aieien-backend.onrender.com
      - key: STRAPI_API_TOKEN
        value: e9a529e01acdf94252c971ed2eace29b1bca402851e7a072f898d6214082edb9d18c5f925839f0b5815ed2dab529667ccbe04f4bac38b229c715d42d6b263cc9084431ce2a2f2a6ef75ee269131c9b4051d59091814164f242b242af1fe4545d5c5161171446b4451e5698f68629f9335c6ad58282de3b7ab103280bc5c47f98
        sync: false
