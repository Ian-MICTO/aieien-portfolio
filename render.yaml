databases:
  - name: aieien-db
    databaseName: strapi
    user: strapi
    region: oregon
    plan: free

services:
  # 1. Strapi API Backend Web Service
  - type: web
    name: aieien-backend
    runtime: docker
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: ./apps/backend
    region: oregon
    plan: free
    healthCheckPath: /_health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 1337
      - key: DATABASE_CLIENT
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: aieien-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: APP_KEYS
        generateValue: true
      - key: API_TOKEN_SALT
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: TRANSFER_TOKEN_SALT
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true

  # 2. Astro Frontend Static Site
  - type: web
    name: aieien-frontend
    runtime: docker
    buildCommand: pnpm --filter web build
    staticPublishPath: ./apps/web/dist
    envVars:
      - key: STRAPI_URL
        fromService:
          type: web
          name: aieien-backend
          property: host
      - key: STRAPI_API_TOKEN
        sync: false
